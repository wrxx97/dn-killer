name: Windows build and release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
      CARGO_PROFILE_TEST_DEBUG: '0'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Check release version
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }
          $version = ($metadata | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check formatting and run tests
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked

      - name: Package the installer and portable executable
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $makensis -PathType Leaf)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install NSIS.' }
          }
          ./installer/package.ps1 -MakeNsis $makensis
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "DN-Killer-$env:VERSION-x64"
          Copy-Item -LiteralPath "target/$name-setup.exe" -Destination dist
          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/dn-killer.exe' -Destination "dist/$name.exe"

      - name: Upload Windows packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dn-killer-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dn-killer-windows-x64
          path: release-assets

      - name: Publish the release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "release-assets/DN-Killer-${GITHUB_REF_NAME#v}-x64.exe" "release-assets/DN-Killer-${GITHUB_REF_NAME#v}-x64-setup.exe" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "DN Killer $GITHUB_REF_NAME" --generate-notes
